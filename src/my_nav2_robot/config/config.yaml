# ESKF 初始参数配置
data_handle_node:
  ros__parameters:
    # 零偏标定时长（秒）：上电后车辆静止期间累积 IMU 数据的时长
    # 范围 1.0~3.0s，期间车辆必须保持静止
    eskf.calibration_duration: 2.0

    # 状态误差协方差初始值 (15×15 对角线标量)
    eskf.P_init: 0.01

    # 过程噪声 (15×15 对角线标量)
    # 值越小 → 越信任 IMU 预测，里程计更平滑
    # 值越大 → 越信任观测更新，响应更快但可能更抖
    eskf.Q_init: 0.005
    eskf.q_pose: 0.00005       # δp 过程噪声（位置），IMU 积分位置漂移速度
    eskf.q_theta: 0.000001    # δθ 过程噪声（姿态），远小于 Q_init，压制 v_anti 的 heading 随机游走

    # 零偏过程噪声（加速度计偏置 b_a、陀螺仪偏置 b_g）
    # 值越小 → 偏置漂移越慢（假设偏置稳定）
    # 值越大 → 偏置可快速变化（适应温漂等）
    # 注意：b_g 应比 b_a 更稳定（MEMS 陀螺零偏不稳定性约 5~20 °/hr）
    eskf.q_b_a: 0.00001
    eskf.q_b_g: 0.00000001

    # 轮速观测噪声 (4×4 对角元素)
    # r_11: vx 观测噪声, r_22: vy 观测噪声
    # r_33: vz (零速约束) 观测噪声, r_44: wz 观测噪声
    # 值越大 → 越不信任对应维度的轮速观测
    eskf.r_11: 0.01
    eskf.r_22: 0.01
    eskf.r_33: 0.0025
    eskf.r_44: 0.0001

    # 零倾斜观测噪声 (2×2 对角元素)
    # r_tilt_11: pitch 约束噪声, r_tilt_22: roll 约束噪声
    # 值越小 → 越强地约束对应轴向，防止该轴漂移
    eskf.r_tilt_11: 0.005
    eskf.r_tilt_22: 0.005

    # 低通滤波平滑系数  y[n] = alpha * x[n] + (1-alpha) * y[n-1]
    # 值越小 -> 滤波越强，越平滑，滞后越大；值越大 -> 越贴近原始数据
    eskf.alpha_lowpass: 0.55       # 加速度计 + 轮速（重滤波，压制噪声）
    eskf.alpha_lowpass_gyro: 0.5   # 陀螺仪（适度响应，捕捉刹车反向脉冲，防止转弯过头）

    # IESKF 迭代更新参数
    eskf.iter_max: 1               # 迭代次数（1=标准KF单次更新；>1 对轮速观测过度校正，会发散）
    eskf.eps_dx: 0.0001            # 收敛阈值（弧度），||δx|| < eps 时停止迭代

    # 点云 ICP 观测参数
    lidar.icp_leaf_size: 0.035        # 体素降采样边长 (m)，MID360 量程 ~40m，0.3 避免 int32 溢出
    lidar.icp_fitness_threshold: 2.0 # fitness_score > 此值则丢弃（配准失败）
    lidar.r_lidar_vx: 0.0015           # ICP 前进速度观测噪声 (m/s)，越小越信任
    lidar.r_lidar_vy: 0.0015             # ICP 横向速度观测噪声，ICP 横向可观测性差，给大噪声
    lidar.r_lidar_vz: 0.0025          # ICP 垂直速度观测噪声
    lidar.r_lidar_wz: 1.0            # ICP yaw 角速度观测噪声 (rad/s)
    lidar.publish_aligned_cloud: false # 是否发布 /gicp/aligned_cloud，诊断掉帧时建议关闭
    lidar.max_points_before_gicp: 0     # GICP 前最大点数，0=不限制；用于诊断降负载
    lidar.lidar_to_body_roll: 0.0    # 雷达系→车体系欧拉角 (rad)
    lidar.lidar_to_body_pitch: 0.0
    lidar.lidar_to_body_yaw: 3.14159265  # 方向反转 180°
