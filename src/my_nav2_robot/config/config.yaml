# ESKF 初始参数配置
data_handle_node:
  ros__parameters:
    # 零偏标定时长（秒）：上电后车辆静止期间累积 IMU 数据的时长
    # 范围 1.0~3.0s，期间车辆必须保持静止
    eskf.calibration_duration: 1.5

    # 状态误差协方差初始值 (15×15 对角线标量)
    eskf.P_init: 0.01

    # 过程噪声 (15×15 对角线标量)
    # 值越小 → 越信任 IMU 预测，里程计更平滑
    # 值越大 → 越信任观测更新，响应更快但可能更抖
    eskf.Q_init: 0.005
    eskf.q_pose: 0.00005       # δp 过程噪声（位置），IMU 积分位置漂移速度
    eskf.q_theta: 0.000001    # δθ 过程噪声（姿态），远小于 Q_init，压制 v_anti 的 heading 随机游走

    # 零偏过程噪声（加速度计偏置 b_a、陀螺仪偏置 b_g）
    # 值越小 → 偏置漂移越慢（假设偏置稳定）
    # 值越大 → 偏置可快速变化（适应温漂等）
    # 注意：b_g 应比 b_a 更稳定（MEMS 陀螺零偏不稳定性约 5~20 °/hr）
    eskf.q_b_a: 0.00001
    eskf.q_b_g: 0.00000001 # 1e-8, 陀螺仪零偏漂移极慢（约束紧）

    # 轮速观测噪声 (4×4 对角元素)
    # r_11: vx 观测噪声, r_22: vy 观测噪声
    # r_33: vz (零速约束) 观测噪声, r_44: wz 观测噪声
    # 值越大 → 越不信任对应维度的轮速观测
    eskf.r_11: 0.01
    eskf.r_22: 0.01
    eskf.r_33: 0.0025
    eskf.r_44: 0.0001

    # 零倾斜观测噪声 (2×2 对角元素)
    # r_tilt_11: pitch 约束噪声, r_tilt_22: roll 约束噪声
    # 值越小 → 越强地约束对应轴向，防止该轴漂移
    eskf.r_tilt_11: 0.005
    eskf.r_tilt_22: 0.005

    # 低通滤波平滑系数  y[n] = alpha * x[n] + (1-alpha) * y[n-1]
    # 值越小 -> 滤波越强，越平滑，滞后越大；值越大 -> 越贴近原始数据
    eskf.alpha_lowpass: 0.55       # 加速度计 + 轮速（重滤波，压制噪声）
    eskf.alpha_lowpass_gyro: 0.5   # 陀螺仪（适度响应，捕捉刹车反向脉冲，防止转弯过头）

    # IESKF 迭代更新参数
    eskf.iter_max: 1               # 迭代次数（1=标准KF单次更新；>1 对轮速观测过度校正，会发散）
    eskf.eps_dx: 0.0001            # 收敛阈值（弧度），||δx|| < eps 时停止迭代

    # 点云 ICP 观测参数
    lidar.icp_leaf_size: 0.15        # 体素降采样边长 (m)，避免 PCL VoxelGrid 在大范围点云上索引溢出
    lidar.icp_fitness_threshold: 2.0 # fitness_score > 此值则丢弃（配准失败）
    lidar.r_lidar_vx: 0.001           # ICP 前进速度观测噪声 (m/s)，越小越信任
    lidar.r_lidar_vy: 0.001             # ICP 横向速度观测噪声，ICP 横向可观测性差，给大噪声
    lidar.r_lidar_vz: 0.0025          # ICP 垂直速度观测噪声
    lidar.r_lidar_wz: 0.001            # ICP yaw 角速度观测噪声 (rad/s)
    lidar.r_lidar_yaw_delta: 0.05     # ICP 帧间 yaw 增量观测噪声，先保守，稳定后可减小

    lidar.publish_aligned_cloud: false # 是否发布 /gicp/aligned_cloud，诊断掉帧时建议关闭
    lidar.max_points_before_gicp: 0     # GICP 前最大点数，0=不限制；用于诊断降负载

    lidar.enable_deskew: true           # 使用每点 timestamp + scan 内 IMU 轨迹做旋转去畸变
    lidar.state_history_duration: 1.5   # deskew/初值使用的 ESKF 状态历史长度（秒）
    lidar.max_range: 80.0               # GICP 前点云最大半径，滤掉 deskew/异常点造成的远距离群
    lidar.min_voxel_leaf_size: 0.05     # GICP 内部体素叶大小下限，防止 PCL VoxelGrid int32 溢出
    lidar.max_gicp_velocity: 2.5        # ICP 平面速度门控，过大视为错配准
    lidar.max_gicp_yaw_rate: 1.5        # ICP yaw rate 门控，只用于 yaw residual 候选检查
    lidar.max_gicp_yaw_delta: 0.12      # 单帧 ICP yaw 增量门控
    lidar.max_gicp_yaw_innovation: 0.025 # ICP 与 ESKF 帧间 yaw 残差门控
    lidar.max_gicp_velocity_innovation: 0.75 # ICP 速度与当前状态速度差门控
    lidar.enable_gicp_local_submap: true # 用 GICP 校正后的历史帧构建 local submap
    lidar.gicp_local_submap_max_frames: 5 # local submap 最多融合的历史帧数
    lidar.gicp_local_submap_min_frames: 2  # 至少几帧历史可用时启用 local submap
    lidar.gicp_local_submap_leaf_size: 0.25 # local submap 体素降采样边长 (m)
    lidar.gicp_local_submap_max_points: 80000 # local submap 最大点数，0=不限制
    
    lidar.publish_gicp_map: false        # 发布 /gicp/map_cloud，用 GICP 相对变换累计叠图
    lidar.gicp_map_leaf_size: 0.15      # 叠图发布前体素降采样边长 (m)
    lidar.gicp_map_max_points: 0   # 叠图最大点数，0=不限制
    lidar.gicp_map_frame: "gicp_map"    # 叠图坐标系，RViz Fixed Frame 设为该值即可查看
    lidar.gicp_map_parent_frame: "odom" # 将叠图坐标系接入 TF 树
    lidar.lidar_to_body_roll: 0.0    # 雷达系→车体系欧拉角 (rad)
    lidar.lidar_to_body_pitch: 0.0
    lidar.lidar_to_body_yaw: 3.14159265  # 方向反转 180°
